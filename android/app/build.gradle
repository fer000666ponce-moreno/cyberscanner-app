apply plugin: 'com.android.application'

android {
    namespace "com.cyberscanner.app"
    compileSdkVersion 34

    defaultConfig {
        applicationId "com.cyberscanner.app"
        minSdkVersion 22
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'

    implementation 'com.getcapacitor:capacitor-android:5.6.0'
}
